<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <!-- Header -->
    <header class="gallery-header">
        <h1>My Photo Gallery</h1>
        <p class="subtitle">A collection of beautiful moments</p>
    </header>

    <!-- Main Gallery Container -->
    <main class="gallery-grid">

        <figure class="gallery-item">
            <img src="Photo 1.jpg" alt="Spring Blossom">
            <figcaption>Spring Blossom</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Photo 2.jpg" alt="Cherry Blossoms">
            <figcaption>Cherry Blossoms</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Photo 3.jpg" alt="City Style">
            <figcaption>City Style</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Photo 4.jpg" alt="Sunset by the Sea">
            <figcaption>Sunset by the Sea</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Photo 5.jpg" alt="Autumn Journey">
            <figcaption>Autumn Journey</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Photo 6.jpg" alt="Golden Autumn Walk">
            <figcaption>Golden Autumn Walk</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Photo 7.jpg" alt="Snowy Forest Vibe">
            <figcaption>Snowy Forest Vibe</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="Photo 8.jpg" alt="Winter Snowfall">
            <figcaption>Winter Snowfall</figcaption>
        </figure>

    </main>

    <!-- Footer -->
    <footer class="gallery-footer">
        <p>&copy; 2026 Syeda Ghulam Fatima Hamdani</p>
    </footer>

</body>
</html>
